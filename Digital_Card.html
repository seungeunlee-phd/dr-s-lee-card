<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --navy: #1F4E79;
    --navy-deep: #173E5F;
    --gold: #C9A961;
    --gold-soft: #D4B879;
    --cream: #E8DCC4;
    --off-white: #FAFAF7;
    --paper: #F5F3EE;
    --text-dark: #2A2A26;
    --text-medium: #555;
    --text-light: #888;
    --text-faint: #999;
    --border: #E5DFD0;
  }
  
  html, body {
    background: var(--paper);
    color: var(--text-dark);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--off-white);
    border-radius: 16px;
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.04),
      0 8px 32px rgba(31, 78, 121, 0.08),
      0 32px 80px rgba(31, 78, 121, 0.04);
    overflow: hidden;
    animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  
  @keyframes cardEnter {
    from {
      opacity: 0;
      transform: translateY(16px) scale(0.98);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }
  
  /* ====== TOP NAVY SECTION ====== */
  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    padding: 36px 28px 32px;
    color: var(--cream);
    position: relative;
    overflow: hidden;
  }
  
  /* Subtle pattern overlay */
  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -30%;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(201, 169, 97, 0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  
  .logo-section {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  
  .logo-svg {
    flex-shrink: 0;
  }
  
  .logo-tagline {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 11px;
    font-style: italic;
    color: var(--gold);
    line-height: 1.5;
    letter-spacing: 0.3px;
  }
  
  .name {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 28px;
    font-weight: 500;
    color: var(--off-white);
    letter-spacing: 0.3px;
    line-height: 1.15;
    margin-bottom: 4px;
  }
  
  .gold-divider {
    width: 32px;
    height: 1px;
    background: var(--gold);
    margin: 12px 0;
  }
  
  .role {
    font-family: Georgia, serif;
    font-size: 13px;
    font-style: italic;
    color: var(--cream);
    letter-spacing: 0.2px;
  }
  
  /* ====== BUSINESS SECTION ====== */
  .business {
    padding: 24px 28px 20px;
    background: var(--off-white);
    border-bottom: 1px solid var(--border);
  }
  
  .company {
    font-family: Georgia, serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--navy);
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  
  .pillars {
    font-size: 9.5px;
    color: var(--text-light);
    letter-spacing: 1.6px;
    text-transform: uppercase;
    font-weight: 500;
  }
  
  /* ====== CONTACT BUTTONS ====== */
  .contacts {
    padding: 16px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  
  .contact-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--off-white);
    border: 1px solid transparent;
    border-radius: 12px;
    text-decoration: none;
    color: var(--text-dark);
    transition: all 0.2s ease;
    cursor: pointer;
    width: 100%;
    text-align: left;
    font-family: inherit;
    font-size: 14px;
  }
  
  .contact-btn:hover {
    background: var(--paper);
    border-color: var(--border);
    transform: translateY(-1px);
  }
  
  .contact-btn:active {
    transform: translateY(0);
  }
  
  .contact-icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    border-radius: 10px;
    color: var(--navy);
  }
  
  .contact-icon svg {
    width: 18px;
    height: 18px;
  }
  
  .contact-text {
    flex: 1;
    min-width: 0;
  }
  
  .contact-label {
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 1.2px;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 2px;
  }
  
  .contact-value {
    font-size: 14px;
    color: var(--text-dark);
    font-weight: 400;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  
  /* Save Contact - special prominent button */
  .save-btn {
    background: var(--navy);
    color: var(--off-white);
    border: none;
    padding: 16px 20px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.3px;
    cursor: pointer;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 8px;
    transition: all 0.2s ease;
  }
  
  .save-btn:hover {
    background: var(--navy-deep);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(31, 78, 121, 0.2);
  }
  
  .save-btn:active {
    transform: translateY(0);
  }
  
  .save-btn svg {
    width: 18px;
    height: 18px;
  }
  
  /* ====== FOOTER ====== */
  .footer {
    padding: 18px 28px 24px;
    text-align: center;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }
  
  .footer-text {
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.5px;
    line-height: 1.6;
  }
  
  /* ====== DESKTOP ENHANCEMENTS ====== */
  @media (min-width: 480px) {
    body {
      padding: 40px 16px;
    }
    
    .card {
      max-width: 400px;
    }
    
    .name {
      font-size: 30px;
    }
  }
  
  /* ====== ACCESSIBILITY ====== */
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .contact-btn, .save-btn { transition: none; }
  }
  
  /* Focus states */
  .contact-btn:focus-visible,
  .save-btn:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
</style>
</head>

<script>
  // Generate vCard on demand
  function generateVCard() {
    const vcard = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'FN:Dr. Seungeun Lee',
      'N:Lee;Seungeun;;Dr.;PhD',
      'ORG:Dr. S. Lee Life Sciences',
      'TITLE:Founder & Principal Consultant',
      'TEL;TYPE=CELL:+31624485060',
      'EMAIL;TYPE=WORK:seungeun@drsleelifesciences.com',
      'URL:https://linkedin.com/in/seungeunlee-phd',
      'NOTE:Strategy · Science · Communication. Rigor in science. Clarity in strategy.',
      'ADR;TYPE=WORK:;;;Nieuw-Vennep;;;Netherlands',
      'END:VCARD'
    ].join('\r\n');
    
    return vcard;
  }
  
  document.getElementById('saveBtn').addEventListener('click', function() {
    const vcard = generateVCard();
    const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Dr_Seungeun_Lee.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
</script>
